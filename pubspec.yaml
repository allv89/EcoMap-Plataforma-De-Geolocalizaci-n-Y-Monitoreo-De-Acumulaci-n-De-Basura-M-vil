name: untitled
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  flutter_map_heatmap: ^0.0.8
  image_picker: ^1.2.3
  http: ^1.2.0
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/portada.png"



  image_path: "assets/portada.png"
  min_sdk_android: 21

  dev_dependencies:
    flutter_native_splash: ^2.4.6

  flutter_native_splash:
    color: "#FFFFFF"
    image: assets/icon/portada.png

    android: true
    ios: true